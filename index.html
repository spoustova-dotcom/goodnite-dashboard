<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodnite · Quality Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #222222;
    --border: rgba(255,255,255,0.07);
    --text: #f0ede8;
    --muted: #7a7870;
    --accent: #c8a96e;
    --accent2: #7ec8a9;
    --danger: #e07070;
    --warn: #e0b870;
    --ok: #7ec8a9;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 0 0 4rem;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(15,15,15,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-moon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-moon::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    background: var(--bg);
    border-radius: 50%;
    top: 2px;
    left: 6px;
  }

  #last-updated {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  /* MAIN LAYOUT */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2.5rem 2.5rem 0;
  }

  /* METRICS ROW */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 2rem;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    position: relative;
    overflow: hidden;
  }

  .metric::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0.5;
  }

  .metric-label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .metric-value {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    color: var(--text);
    line-height: 1;
  }

  .metric-value.danger { color: var(--danger); }
  .metric-value.ok { color: var(--ok); }

  .metric-sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  /* SECTION TITLE */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1rem;
    margin-top: 2rem;
  }

  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--text);
    font-weight: normal;
  }

  .section-sub {
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* ALERT STRIP */
  .alerts {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 0.5rem;
  }

  .alert-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    transition: background 0.15s;
    text-decoration: none;
    color: inherit;
  }

  .alert-row:hover { background: var(--surface2); }

  .alert-name {
    font-size: 0.88rem;
    font-weight: 400;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .alert-score {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--danger);
    white-space: nowrap;
  }

  .alert-reviews {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* SCORE BARS */
  .score-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .score-row {
    display: grid;
    grid-template-columns: 220px 1fr 48px;
    align-items: center;
    gap: 12px;
  }

  .score-apt-name {
    font-size: 0.82rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .score-track {
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .score-val {
    font-size: 0.85rem;
    font-weight: 500;
    text-align: right;
  }

  /* GRID CARDS */
  .apt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .apt-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s, transform 0.15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .apt-card:hover {
    background: var(--surface2);
    transform: translateY(-1px);
  }

  .apt-card-name {
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
  }

  .apt-card-score {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    line-height: 1;
  }

  .apt-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }

  .apt-card-clean {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .apt-card-reviews {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .score-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
  }

  /* STATUS BADGE */
  .badge {
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .badge-ok { background: rgba(126,200,169,0.12); color: var(--ok); }
  .badge-warn { background: rgba(224,184,112,0.12); color: var(--warn); }
  .badge-danger { background: rgba(224,112,112,0.12); color: var(--danger); }

  /* LOADING / ERROR */
  .state-msg {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s;
  }

  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* FOOTER */
  footer {
    max-width: 1200px;
    margin: 3rem auto 0;
    padding: 0 2.5rem;
    border-top: 1px solid var(--border);
    padding-top: 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    header { padding: 1rem 1.25rem; }
    main { padding: 1.5rem 1.25rem 0; }
    .score-row { grid-template-columns: 140px 1fr 40px; }
    footer { padding: 1rem 1.25rem; flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-moon"></div>
    Goodnite Quality
  </div>
  <span id="last-updated">načítám data…</span>
</header>

<main>
  <div id="loading" class="state-msg">
    <span class="spinner"></span> Načítám hodnocení apartmánů…
  </div>

  <div id="content" style="display:none">

    <!-- METRICS -->
    <div class="metrics" id="metrics"></div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('overview')">Přehled</button>
      <button class="tab-btn" onclick="switchTab('alerts')">⚠ Pozornost</button>
      <button class="tab-btn" onclick="switchTab('cards')">Všechny</button>
    </div>

    <!-- OVERVIEW TAB -->
    <div class="tab-panel active" id="tab-overview">
      <div class="section-header">
        <span class="section-title">Hodnocení podle apartmánu</span>
        <span class="section-sub">seřazeno od nejlepšího</span>
      </div>
      <div class="score-table" id="score-bars"></div>
    </div>

    <!-- ALERTS TAB -->
    <div class="tab-panel" id="tab-alerts">
      <div class="section-header">
        <span class="section-title">Vyžadují pozornost</span>
        <span class="section-sub">hodnocení pod 8.5</span>
      </div>
      <div class="alerts" id="alert-list"></div>
      <div id="no-alerts" class="state-msg" style="display:none">
        ✓ Všechna hodnocení jsou nad 8.5
      </div>
    </div>

    <!-- CARDS TAB -->
    <div class="tab-panel" id="tab-cards">
      <div class="apt-grid" id="apt-cards"></div>
    </div>

  </div>

  <div id="error-msg" class="state-msg" style="display:none">
    Nepodařilo se načíst data. Zkontrolujte, že soubor <code>data.json</code> existuje v repozitáři.
  </div>
</main>

<footer>
  <span>Goodnite Quality Dashboard</span>
  <span id="footer-updated"></span>
</footer>

<script>
function scoreColor(s) {
  if (!s) return '#555';
  if (s >= 9.0) return 'var(--ok)';
  if (s >= 8.5) return 'var(--accent2)';
  if (s >= 8.0) return 'var(--warn)';
  return 'var(--danger)';
}

function badgeClass(s) {
  if (!s) return 'badge-warn';
  if (s >= 8.5) return 'badge-ok';
  if (s >= 8.0) return 'badge-warn';
  return 'badge-danger';
}

function badgeText(s) {
  if (!s) return 'N/A';
  if (s >= 9.0) return 'Výborné';
  if (s >= 8.5) return 'Dobré';
  if (s >= 8.0) return 'Sledovat';
  return 'Pozornost';
}

function fmt(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(1);
}

function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' });
}

function render(data) {
  const apts = data.apartments || [];
  const scored = apts.filter(a => a.score !== null);
  const alerts = apts.filter(a => a.score !== null && a.score < 8.5);
  const avg = scored.length ? scored.reduce((s, a) => s + a.score, 0) / scored.length : null;
  const totalReviews = apts.reduce((s, a) => s + (a.review_count || 0), 0);

  // Last updated
  const updatedStr = formatDate(data.scraped_at);
  document.getElementById('last-updated').textContent = 'Aktualizováno: ' + updatedStr;
  document.getElementById('footer-updated').textContent = 'Data: Booking.com · ' + updatedStr;

  // METRICS
  document.getElementById('metrics').innerHTML = `
    <div class="metric">
      <div class="metric-label">Apartmánů</div>
      <div class="metric-value">${apts.length}</div>
      <div class="metric-sub">sledovaných objektů</div>
    </div>
    <div class="metric">
      <div class="metric-label">Průměr celkový</div>
      <div class="metric-value ${avg >= 8.5 ? 'ok' : 'danger'}">${avg ? avg.toFixed(1) : '—'}</div>
      <div class="metric-sub">z 10 (Booking.com)</div>
    </div>
    <div class="metric">
      <div class="metric-label">Potřebují pozornost</div>
      <div class="metric-value ${alerts.length > 0 ? 'danger' : 'ok'}">${alerts.length}</div>
      <div class="metric-sub">hodnocení pod 8.5</div>
    </div>
    <div class="metric">
      <div class="metric-label">Recenzí celkem</div>
      <div class="metric-value">${totalReviews > 0 ? totalReviews.toLocaleString('cs-CZ') : '—'}</div>
      <div class="metric-sub">na Booking.com</div>
    </div>
  `;

  // SCORE BARS
  const sorted = [...apts].sort((a, b) => (b.score || 0) - (a.score || 0));
  document.getElementById('score-bars').innerHTML = sorted.map(a => `
    <div class="score-row">
      <div class="score-apt-name" title="${a.name}">${a.name}</div>
      <div class="score-track">
        <div class="score-fill" style="width:${a.score ? (a.score / 10 * 100) : 0}%; background:${scoreColor(a.score)}"></div>
      </div>
      <div class="score-val" style="color:${scoreColor(a.score)}">${fmt(a.score)}</div>
    </div>
  `).join('');

  // ALERTS
  if (alerts.length === 0) {
    document.getElementById('no-alerts').style.display = 'block';
  } else {
    document.getElementById('alert-list').innerHTML = alerts
      .sort((a, b) => (a.score || 0) - (b.score || 0))
      .map(a => `
        <a class="alert-row" href="${a.url}" target="_blank" rel="noopener">
          <span class="alert-name">${a.name}</span>
          ${a.review_count ? `<span class="alert-reviews">${a.review_count} recenzí</span>` : ''}
          <span class="alert-score">${fmt(a.score)}</span>
        </a>
      `).join('');
  }

  // CARDS
  document.getElementById('apt-cards').innerHTML = sorted.map(a => `
    <a class="apt-card" href="${a.url}" target="_blank" rel="noopener">
      <div class="apt-card-name">${a.name}</div>
      <div class="apt-card-score" style="color:${scoreColor(a.score)}">${fmt(a.score)}</div>
      <div class="apt-card-footer">
        <span class="apt-card-clean">${a.score_cleanliness ? 'Úklid: ' + fmt(a.score_cleanliness) : ''}</span>
        <span class="badge ${badgeClass(a.score)}">${badgeText(a.score)}</span>
      </div>
      ${a.review_count ? `<div class="apt-card-reviews">${a.review_count} recenzí</div>` : ''}
    </a>
  `).join('');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// Load data
fetch('data.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(err => {
    console.error(err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
  });
</script>
</body>
</html>
